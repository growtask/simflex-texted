<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ted — обход блоков: запуск…</title>
<!-- Автотест «обход всех блоков»: страница walkthrough.html прогоняется в iframe шириной 1000 / 860 / 768 / 414 в светлой и тёмной теме.
     Ширина iframe — это ширина окна для медиазапросов содержимого, поэтому ловятся ошибки раскладки, которые тесты контейнера не видят. -->
<style>body { margin: 24px; font: 14px/1.5 Inter, system-ui, sans-serif; } .fail { color: #cc2929; } iframe { border: 1px solid #dadfe5; display: block; margin: 8px 0; }</style>
</head>
<body>
<h1>Ted — обход всех блоков</h1>
<p id="summary">Запуск…</p>
<ul id="list"></ul>
<div id="frames"></div>
<script>
(async function () {
  var widths = [1000, 860, 768, 414];
  var themes = ['light', 'dark'];
  var failures = [];
  var total = 0;
  var runs = 0;
  var list = document.getElementById('list');
  var q = new URLSearchParams(location.search);
  if (q.get('w')) widths = q.get('w').split(',').map(Number);
  if (q.get('theme')) themes = q.get('theme').split(',');
  function wait(fn, ms) {
    return new Promise(function (res) {
      var t0 = Date.now();
      (function tick() { var v = fn(); if (v) return res(v); if (Date.now() - t0 > ms) return res(null); setTimeout(tick, 100); })();
    });
  }
  for (var ti = 0; ti < themes.length; ti++) {
    for (var wi = 0; wi < widths.length; wi++) {
      var w = widths[wi], theme = themes[ti];
      var tag = w + ' px, ' + (theme === 'dark' ? 'тёмная' : 'светлая');
      var f = document.createElement('iframe');
      f.style.width = w + 'px'; f.style.height = '900px';
      f.src = 'walkthrough.html' + (theme === 'dark' ? '?dark' : '');
      document.getElementById('frames').appendChild(f);
      var res = await wait(function () { try { return f.contentWindow.__walk; } catch (e) { return null; } }, 300000);
      runs += 1;
      if (!res) { failures.push(tag + ' — обход не завершился'); }
      else {
        total += res.results.length;
        res.issues.forEach(function (i) { failures.push(tag + ' — ' + i); });
        if (res.results.length < 70) failures.push(tag + ' — выполнено только ' + res.results.length + ' сценариев');
      }
      f.remove();
    }
  }
  failures.forEach(function (m) { var li = document.createElement('li'); li.className = 'fail'; li.textContent = m; list.appendChild(li); });
  document.getElementById('summary').textContent = failures.length ? 'Не прошло ' + failures.length + ' (прогонов: ' + runs + ')' : 'Все тесты прошли: ' + total + ' сценариев в ' + runs + ' прогонах';
  document.title = failures.length ? 'Ted — обход: ошибки' : 'Ted — обход: Все тесты прошли';
})();
</script>
</body>
</html>
