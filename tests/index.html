<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ted — автотесты</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../dist/ted.css">
<style>
  body { margin: 0; padding: 24px; font: 14px/1.5 Inter, system-ui, sans-serif; color: #262626; background: #fff; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  #summary { margin: 0 0 16px; font-weight: 600; }
  #summary.ok { color: #0f7a3b; }
  #summary.fail { color: #cc2929; }
  #list { list-style: none; margin: 0; padding: 0; max-width: 900px; }
  #list li { padding: 4px 0; border-bottom: 1px solid #edf3fa; }
  #list li.fail { color: #cc2929; }
  #list li.fail .err { display: block; margin: 2px 0 4px 20px; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .m { display: inline-block; width: 16px; }
  #sandbox-note { color: #919599; margin-top: 24px; }
</style>
</head>
<body>
<h1>Ted — автотесты</h1>
<p id="summary">Запуск…</p>
<ul id="list"></ul>
<p id="sandbox-note">Тесты работают на исходниках из <code>src/</code> и стилях из <code>dist/ted.css</code>. Адрес со сервера: <code>http://localhost:8140/tests/index.html</code> (запуск <code>tools/serve.ps1</code>). Фильтр: <code>?q=якор</code>. Редакторы из тестов после прогона убираются; чтобы их посмотреть, добавьте <code>?keep</code>.</p>
<script src="../content.js"></script>
<script type="module">
  import { run } from './harness.js';
  import './typo.test.js';
  import './sanitize.test.js';
  import { cleanup } from './editor.test.js';
  import './sizes.test.js';
  import './media.test.js';
  import './content.test.js';
  import './security.test.js';
  import './blocks-option.test.js';
  import './blocks-json.test.js';
  import './table.test.js';
  import './narrow.test.js';
  import './formula.test.js';
  import './accordion.test.js';
  import './tabs.test.js';
  import './toc.test.js';
  import './columns.test.js';
  import './button.test.js';
  import './iframe.test.js';
  import './embed.test.js';
  import './product.test.js';

  const q = new URLSearchParams(location.search).get('q');
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  const only = new URLSearchParams(location.search).get('only');
  const results = await run((r) => {
    if (q && !r.name.toLowerCase().includes(q.toLowerCase())) return;
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'fail';
    li.innerHTML = `<span class="m">${r.ok ? '✓' : '✗'}</span>`;
    li.append(r.name);
    if (!r.ok) { const e = document.createElement('span'); e.className = 'err'; e.textContent = r.error; li.append(e); }
    if (!r.ok || !q) list.append(li);
  }, only, { fast: new URLSearchParams(location.search).has('fast') });
  if (!new URLSearchParams(location.search).has('keep')) cleanup();
  const failed = results.filter((r) => !r.ok);
  summary.textContent = failed.length ? `Не прошло ${failed.length} из ${results.length}` : `Все тесты прошли: ${results.length}`;
  summary.className = failed.length ? 'fail' : 'ok';
  document.title = (failed.length ? '✗ ' : '✓ ') + summary.textContent;
  window.__tedTests = { total: results.length, failed: failed.map((r) => ({ name: r.name, error: r.error })) };
</script>
</body>
</html>
