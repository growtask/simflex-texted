<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ted — снимок расположения</title>
<!-- Снимок расположения содержимого: где стоит каждая строка текста, картинка, таблица, линия — на сайте и в редакторе.
     Нужен, когда меняется устройство отступов (этап 0 MODULAR_PLAN.md): снимок до и после должен совпасть.
     Запуск: pwsh -File tools/layout-snapshot.ps1 -OutFile before.txt (окна 320 / 414 / 768 / 1000 / 1920). -->
<link rel="stylesheet" href="../dist/ted.css">
<style>* { transition: none !important; animation: none !important; } body { margin: 0; } #site, #ed { width: 100%; }</style>
</head>
<body>
<div id="site" class="ted-content"></div>
<textarea id="ed"></textarea>
<pre id="out">...</pre>
<script src="../dist/ted.js"></script>
<script>
(async function () {
  var params = new URLSearchParams(location.search);
  if (!params.has('child')) {
    // родитель: «окна» нужной ширины — фреймы (медиазапросы сайта считают ширину фрейма), снимок каждого — сообщением
    document.getElementById('ed').remove();
    document.getElementById('site').remove();
    var widths = (params.get('w') || '320,414,768,1000,1920').split(',').map(Number);
    var lines = [];
    for (var wi = 0; wi < widths.length; wi++) {
      lines = lines.concat(await new Promise(function (resolve) {
        var f = document.createElement('iframe');
        f.style.cssText = 'width:' + widths[wi] + 'px;height:6000px;border:0;display:block';
        window.addEventListener('message', function on(e) { if (e.source !== f.contentWindow) return; window.removeEventListener('message', on); f.remove(); resolve(e.data); });
        f.src = location.pathname + '?child=1';
        document.body.appendChild(f);
      }));
    }
    document.getElementById('out').textContent = 'SNAP-BEGIN\n' + lines.join('\n') + '\nSNAP-END';
    return;
  }
  await Promise.all(['400', '500', '600', '700'].map(function (w) { return document.fonts.load(w + ' 14px Inter'); }));
  await document.fonts.load('400 14px "Roboto Mono"');
  await document.fonts.ready;
  var HTML = '<h2>Заголовок</h2><p>Текст <strong>жирный</strong> <a href="/x">ссылка</a> и ещё немного текста, чтобы строка перенеслась на узком экране.</p>' +
    '<h3>Подзаголовок</h3><ul><li>Пункт</li><li>Два</li></ul><ol><li>Раз</li></ol><blockquote><p>Цитата</p></blockquote>' +
    '<h4>Четвёртый</h4><ul class="ted-checklist"><li class="ted-checked">Отмечен</li><li>Нет</li></ul>' +
    '<ol class="ted-steps"><li><strong>Шаг</strong><br>Описание</li><li><strong>Два</strong><br>Описание два</li></ol>' +
    '<blockquote class="ted-callout"><p><strong>Выноска</strong></p><p>Текст выноски</p></blockquote>' +
    '<ul class="ted-facts"><li><strong>120+</strong><br>стран</li><li><strong>4.8</strong><br>оценка</li></ul>' +
    '<ul class="ted-proscons"><li class="ted-pros"><strong>Плюсы</strong><ul><li>Раз</li><li>Два</li></ul></li><li class="ted-cons"><strong>Минусы</strong><ul><li>Три</li></ul></li></ul>' +
    '<p class="ted-bg-gray">Серый</p><h2 class="ted-bg-color1">Заголовок на фоне</h2><p class="ted-bg-color2">Доп</p>' +
    '<blockquote><p>С автором</p><p class="ted-author"><strong>Анна Петрова</strong><br>Редактор</p></blockquote>' +
    '<pre data-lang="js" data-nums="1\n2"><code>let a = 1;\nlet b = 2;</code></pre><hr><h5>Пятый</h5><p class="ted-align-center">По центру</p><h6>Шестой</h6>' +
    '<figure class="ted-table"><div class="ted-table__wrap"><table data-cols="2"><thead><tr><th>А</th><th>Б</th></tr></thead><tbody><tr><td>1</td><td>2</td></tr></tbody></table></div><figcaption>Подпись таблицы</figcaption></figure>' +
    '<h2>После таблицы</h2>' +
    '<figure class="ted-media ted-media--image"><img src="../tiles/p.webp" alt="" width="1200" height="600"><figcaption>Подпись картинки</figcaption></figure>' +
    '<div class="ted-columns ted-columns--2"><div class="ted-columns__col"><h6>Колонка</h6><p>Текст колонки</p></div><div class="ted-columns__col"><h6>Вторая</h6><p>Текст</p></div></div>' +
    '<div class="ted-button"><a class="ted-button__btn" href="/a">Кнопка</a></div>' +
    '<div class="ted-button ted-button--banner"><div class="ted-button__text"><p class="ted-button__title">Баннер</p><p class="ted-button__desc">Текст баннера</p></div><a class="ted-button__btn" href="/a">Кнопка</a></div>' +
    '<figure class="ted-iframe"><iframe src="about:blank" height="200" title="Фрейм"></iframe><figcaption>Подпись фрейма</figcaption></figure>' +
    '<div class="ted-embed"><div class="ted-embed__head"><span class="ted-embed__avatar">GI</span><span class="ted-embed__who"><span class="ted-embed__name">Карточка</span><span class="ted-embed__sub">Сайт</span></span></div><p class="ted-embed__text">Описание</p><div class="ted-embed__foot"><a class="ted-embed__open" href="https://github.com/">Открыть</a></div></div>' +
    '<div class="ted-product"><span class="ted-product__img"></span><div class="ted-product__text"><p class="ted-product__name">Наушники</p><p class="ted-product__price"><span class="ted-product__now">12 900 ₽</span></p></div><a class="ted-product__btn" href="/a">Перейти</a></div>' +
    '<h3>Перед аккордеоном</h3>' +
    '<div class="ted-accordion"><details class="ted-accordion__item" open><summary class="ted-accordion__q">Вопрос</summary><div class="ted-accordion__body"><p>Ответ</p><p>Второй абзац</p></div></details></div>' +
    '<p>Абзац после аккордеона</p><p>Последний абзац</p>';

  var out = [];
  function rel(r, base) { return [r.top - base.top, r.left - base.left, r.bottom - base.top, r.right - base.left].map(function (v) { return Math.round(v * 2) / 2; }).join(','); }
  function probe(label, root) {
    var base = root.getBoundingClientRect();
    // служебные элементы редактора внутри содержимого (панели медиа, поля) не считаем
    var isUi = function (el) { var ui = el.closest('[class^="ted-ui-"], [class*=" ted-ui-"]'); return !!(ui && ui !== root && root.contains(ui)); };
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: function (n) { return n.data.trim() && !isUi(n.parentElement) ? 1 : 3; } });
    var n, i = 0;
    while ((n = w.nextNode())) {
      var r = document.createRange(); r.selectNodeContents(n);
      var rects = r.getClientRects(); if (!rects.length) continue;
      out.push(label + '|t' + (i++) + '|' + n.data.trim().slice(0, 16) + '|' + rel(rects[0], base) + '|' + rel(rects[rects.length - 1], base));
    }
    root.querySelectorAll('img, iframe, table, hr, video, .ted-product__img, .ted-embed__avatar').forEach(function (el, k) {
      if (isUi(el)) return;
      out.push(label + '|e' + k + '|' + el.tagName + '|' + rel(el.getBoundingClientRect(), base));
    });
  }
  var W = innerWidth;
  document.getElementById('site').innerHTML = Ted.clean(HTML);
  window.TedContent && window.TedContent.mount && window.TedContent.mount(document.getElementById('site'));
  probe('site@' + W, document.getElementById('site'));
  document.getElementById('site').remove();
  document.getElementById('ed').value = HTML;
  var ed = Ted.init({ selector: '#ed' })[0];
  await new Promise(function (r) { setTimeout(r, 300); });
  probe('editor@' + W, ed.editable);
  parent.postMessage(out, '*');
})();
</script>
</body>
</html>
