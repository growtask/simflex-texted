<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ted — обход всех блоков</title>
<!-- Живой редактор: каждый блок добавлен через меню, наполнен и пройден доступными кнопками панели.
     ?dark — тёмная тема. Перед каждым результатом — подпись (h6) «блок · что сделано».
     Справа внизу — сводка автопроверок (переполнение, служебные символы, повторная очистка, ошибки скриптов). -->
<link rel="stylesheet" href="../examples/site-theme.css">
<link rel="stylesheet" href="../dist/ted.css">
<link rel="stylesheet" href="../examples/demo.css">
<style>
  html, body { margin: 0; background: #fff; }
  .ted-ui { --ted-editor-min-height: 100vh; }
  #walk-panel { position: fixed; right: 12px; bottom: 12px; z-index: 99999; width: 340px; max-height: 60vh; overflow: auto; padding: 10px 12px; border-radius: 12px; background: #262626; color: #fff; font: 12px/1.4 Inter, system-ui, sans-serif; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
  #walk-panel b { display: block; margin-bottom: 4px; font-size: 13px; }
  #walk-panel .bad { color: #ffa6a6; margin: 2px 0; }
  #walk-panel .ok { color: #c3e5c3; }
  #walk-panel button { margin-left: 8px; font: inherit; }
</style>
</head>
<body>
<textarea id="content"></textarea>
<div id="walk-panel"><b>Обход блоков…</b></div>
<script src="../dist/ted.js"></script>
<script>
(async function () {
  var params = new URLSearchParams(location.search);
  var ed = Ted.init({
    selector: '#content', unit: 'vw', previewScreen: 'editor', theme: params.has('dark') ? 'dark' : 'light',
    contentCss: ['../examples/site-theme.css'],
    authors: [{ id: 'a1', name: 'Анна Петрова', role: 'Главный редактор' }, { id: 'a2', name: 'Иван Смирнов', role: 'Автор' }],
  })[0];
  var E = ed.editable;
  var results = [];
  var issues = [];
  var errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message); });
  window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason)); });

  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms || 0); }); };
  var raf = function () { return new Promise(function (r) { setTimeout(r, 30); }); };   // не rAF: в headless с виртуальным временем кадры не идут

  function emptyP() { var p = document.createElement('p'); p.appendChild(document.createElement('br')); return p; }
  function isEmptyP(el) { return el && el.tagName === 'P' && !el.textContent.replace(/​/g, '').trim() && !el.className; }
  function tail() {
    var last = E.lastElementChild;
    if (!isEmptyP(last)) { last = emptyP(); E.appendChild(last); }
    return last;
  }
  function caretAt(el, end) {
    ed.focus();
    var r = document.createRange();
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    var t = null, n;
    while ((n = w.nextNode())) t = n;
    if (t && end) r.setStart(t, t.data.length); else if (t) r.setStart(w.currentNode === t ? t : el.firstChild || el, 0); else r.setStart(el, 0);
    r.collapse(true);
    getSelection().removeAllRanges();
    getSelection().addRange(r);
    ed.updatePlaceholders(); ed.updateState(); ed.handle.syncItem();
  }
  function typeText(s) { document.execCommand('insertText', false, s); }
  // Клавиша: сначала обработчики редактора; если они не отменили действие — делаем то, что сделал бы браузер
  function key(k, o) {
    var ev = new KeyboardEvent('keydown', Object.assign({ key: k, bubbles: true, cancelable: true }, o || {}));
    E.dispatchEvent(ev);
    if (ev.defaultPrevented) return;
    if (k === 'Enter') document.execCommand(o && o.shiftKey ? 'insertLineBreak' : 'insertParagraph');
    else if (k === 'Backspace') document.execCommand('delete');
    else if (k === 'Delete') document.execCommand('forwardDelete');
  }
  async function fin() { ed.afterChange({ immediate: true }); await raf(); }

  async function label(text) {
    var t = tail();
    var h = document.createElement('h6');
    h.textContent = text;
    t.replaceWith(h);
    E.appendChild(emptyP());
    await fin();
  }

  async function insert(type) {
    var t = tail();
    var before = new Set(Array.from(E.children));
    caretAt(t);
    ed.blockMenu.openPicker(t);
    var tile = ed.blockMenu.picker.panel.querySelector('.ted-ui-tile[data-type="' + type + '"]');
    if (!tile) throw new Error('нет плитки ' + type);
    tile.click();
    await sleep(40);
    await fin();
    var added = Array.from(E.children).filter(function (c) { return !before.has(c); });
    if (!added.length) throw new Error('блок ' + type + ' не появился');
    return added[0];
  }

  function selectWord(el, word) {
    ed.focus();
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    var n;
    while ((n = w.nextNode())) {
      var i = n.data.indexOf(word);
      if (i >= 0) {
        var r = document.createRange();
        r.setStart(n, i); r.setEnd(n, i + word.length);
        getSelection().removeAllRanges(); getSelection().addRange(r);
        ed.updateState();
        return true;
      }
    }
    return false;
  }

  // ----- кнопки панели
  function toolbarButton(name) {
    var tb = ed.toolbar;
    var map = { bold: tb.marks.bold, italic: tb.marks.italic, underline: tb.marks.underline, strike: tb.marks.strike, code: tb.marks.code, link: tb.marks.link, anchor: tb.anchorBtn, style: tb.styleBtn, align: tb.alignBtn, color: tb.colorBtn, magic: tb.magicBtn, more: tb.moreBtn, all: tb.allBlocksBtn };
    return map[name];
  }
  function btnState(name) {
    var b = toolbarButton(name);
    if (!b || !b.isConnected) return 'нет';
    if (b.hidden || b.offsetParent === null) return 'скрыта';
    if (b.disabled) return 'недоступна';
    return 'есть';
  }
  async function press(name) {
    var st = btnState(name);
    if (st !== 'есть') return st;
    var b = toolbarButton(name);
    b.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
    b.click();
    await sleep(30);
    return 'ok';
  }
  async function menuPick(btnName, re) {
    var st = await press(btnName);
    if (st !== 'ok') return st;
    var items = Array.from(document.querySelectorAll('.ted-ui-pop .ted-ui-item'));
    var it = items.find(function (x) { return re.test(x.textContent); });
    if (!it) { ed.popover.close(); return 'нет пункта ' + re; }
    it.click();
    await sleep(40);
    await fin();
    return 'ok';
  }
  async function popupInput(value) {
    await sleep(40);
    var input = document.querySelector('.ted-ui-pop input[type="text"], .ted-ui-pop input:not([type])');
    if (!input) return false;
    input.value = value;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    await sleep(40);
    ed.popover.close();
    await fin();
    return true;
  }

  // ----- автопроверки
  function check(tag) {
    var bad = [];
    ed.ui.scrollLeft = 0; ed.toolbar.el.scrollLeft = 0;   // клик по кнопке панели за краем (узкое окно) подкручивает контейнеры — это не раскладка блоков
    if (ed.ui.scrollWidth > ed.ui.clientWidth + 1) {
      var edge = ed.ui.getBoundingClientRect().right;
      var overflow = Array.from(ed.ui.querySelectorAll('*')).filter(function (el) { return !el.closest('.ted-ui-toolbar') && el.getBoundingClientRect().right > edge + 1; }).slice(0, 12);
      bad.push('горизонтальная прокрутка редактора: ' + ed.ui.scrollWidth + '/' + ed.ui.clientWidth + ' ' + overflow.map(function (el) { return (el.getAttribute('class') || el.tagName) + '+' + Math.round(el.getBoundingClientRect().right - edge); }).join(', '));
    }
    var inner = ed.getInnerHTML();
    if (/data-tedui|​/.test(inner)) bad.push('служебные символы в сохранённом HTML');
    var again = Ted.clean(inner);
    if (again !== inner) bad.push('повторная очистка меняет HTML');
    var cr = E.getBoundingClientRect();
    Array.from(E.querySelectorAll('*')).forEach(function (el) {
      if (el.closest('pre, .ted-table__wrap, .ted-tabs__bar')) return;   // код, широкая таблица и ряд вкладок прокручиваются внутри себя
      var r = el.getBoundingClientRect();
      if (r.width && (r.right > cr.right + 2 || r.left < cr.left - 2) && !bad.some(function (b) { return /выходит за колонку/.test(b); })) bad.push('выходит за колонку: <' + el.tagName.toLowerCase() + '> ' + (el.textContent || '').slice(0, 20));
    });
    // плавающие кнопки (блока, элемента, строки и столбца таблицы) не лежат друг на друге и не обрезаются краем редактора
    var ui = ed.ui.getBoundingClientRect();
    var floats = Array.from(ed.ui.querySelectorAll('.ted-ui-controls.is-visible, .ted-ui-itemctl.is-visible')).filter(function (el) { return el.offsetParent !== null && getComputedStyle(el).opacity !== '0'; });
    floats.forEach(function (a, i) {
      var ra = a.getBoundingClientRect();
      if (ra.left < ui.left - 1 || ra.right > ui.right + 1) bad.push('кнопки за краем редактора: ' + (a.className || '').replace(/ted-ui-/g, ''));
      floats.slice(i + 1).forEach(function (b) {
        var rb = b.getBoundingClientRect();
        if (ra.left < rb.right - 1 && rb.left < ra.right - 1 && ra.top < rb.bottom - 1 && rb.top < ra.bottom - 1) bad.push('кнопки друг на друге: ' + (a.className || '').replace(/ted-ui-/g, '') + ' / ' + (b.className || '').replace(/ted-ui-/g, ''));
      });
    });
    if (errors.length) { bad.push('ошибки скрипта: ' + errors.join('; ')); errors.length = 0; }
    bad.forEach(function (b) { issues.push(tag + ' — ' + b); });
    return bad;
  }
  // ожидание сценария: ложь → замечание (попадает в сводку и роняет автотест)
  var curName = '';
  function expect(cond, msg) { if (!cond) issues.push(curName + ' — ожидалось: ' + msg); }
  async function scenario(name, fn) {
    curName = name;
    try {
      curName = name;
      await label(name);
      var log = await fn();
      var bad = check(name);
      results.push({ name: name, ok: !bad.length, note: Array.isArray(log) ? log.join(', ') : (log || '') });
    } catch (e) {
      issues.push(name + ' — исключение: ' + (e && e.message || e));
      results.push({ name: name, ok: false, note: String(e && e.message || e) });
    }
  }
  var WORD = 'ВЫДЕЛЕНИЕ';
  async function textPara(text) {
    var t = tail();
    caretAt(t);
    typeText(text || ('Обычный текст со словом ' + WORD + ' внутри абзаца.'));
    await fin();
    return t;
  }

  // =============== ТЕКСТ ===============
  await scenario('Текст · пустой абзац: заглушка', async function () {
    var t = tail(); caretAt(t); await fin();
    if (!t.getAttribute('data-tedui-ph')) throw new Error('нет заглушки');
    return 'заглушка есть';
  });
  await scenario('Текст · набран', async function () { await textPara(); });
  var marks = [['bold', 'Жирный'], ['italic', 'Курсив'], ['underline', 'Подчёркнутый'], ['strike', 'Зачёркнутый'], ['code', 'Строчный код']];
  for (var mi = 0; mi < marks.length; mi++) {
    await (function (m) { return scenario('Текст · ' + m[1], async function () {
      var p = await textPara(); selectWord(p, WORD); var s = await press(m[0]); await fin(); var tags = { bold: 'strong,b', italic: 'em,i', underline: 'u', strike: 's,del', code: 'code' }; expect(Ted.clean(p.outerHTML).match(new RegExp('<(' + tags[m[0]].replace(',', '|') + ')[ >]')) !== null, 'в сохранённом абзаце есть <' + tags[m[0]] + '> после «' + m[1] + '»'); return s;
    }); })(marks[mi]);
  }
  await scenario('Текст · ссылка', async function () {
    var p = await textPara(); selectWord(p, WORD); var s = await press('link');
    var ok = await popupInput('/catalog');
    return 'кнопка: ' + s + ', адрес введён: ' + ok;
  });
  await scenario('Текст · якорь', async function () {
    var p = await textPara(); caretAt(p); var s = await press('anchor'); var ok = await popupInput('anchor-test');
    return 'кнопка: ' + s + ', id: ' + ok;
  });
  await scenario('Текст · по центру', async function () { var p = await textPara(); return await menuPick('align', /По центру/); });
  await scenario('Текст · справа', async function () { var p = await textPara(); return await menuPick('align', /Справа/); });
  await scenario('Текст · фон стандартный', async function () { var p = await textPara(); return await menuPick('color', /Стандартный/); });
  await scenario('Текст · фон акцентный', async function () { var p = await textPara(); return await menuPick('color', /Акцентный/); });
  await scenario('Текст · фон дополнительный', async function () { var p = await textPara(); return await menuPick('color', /Дополнительный/); });
  await scenario('Текст · фон снят', async function () { var p = await textPara(); await menuPick('color', /Акцентный/); return await menuPick('color', /Удалить фон/); });
  await scenario('Текст · ✨ форматирование', async function () { var p = await textPara('Привет - мир "в кавычках" 10 штук'); var s = await press('magic'); await sleep(60); ed.popover.close && ed.popover.close(); return s; });

  // заголовки
  for (var hl = 2; hl <= 6; hl++) {
    await (async function (level) {
      await scenario('Заголовок ' + level, async function () {
        var p = await textPara('Заголовок уровня ' + level);
        var r = await menuPick('style', new RegExp('Заголовок ' + level));
        expect(r === 'ok', 'пункт «Заголовок ' + level + '» есть в меню «Стиль текста» (' + r + ')');
        var hs = Array.from(E.querySelectorAll('h' + level)).filter(function (x) { return x.textContent === 'Заголовок уровня ' + level; });
        expect(hs.length === 1, 'абзац стал <h' + level + '>');
        return r;
      });
    })(hl);
  }
  await scenario('Заголовок 5 (Markdown «#### »)', async function () { var t = tail(); caretAt(t); typeText('####'); typeText(' '); typeText('Заголовок пятого уровня'); await fin(); expect(!!E.querySelector('h5:last-of-type') || Array.from(E.querySelectorAll('h5')).some(function (x) { return /пятого/.test(x.textContent); }), 'Markdown «#### » создаёт h5'); });
  await scenario('Заголовок 6 (Markdown «##### »)', async function () { var t = tail(); caretAt(t); typeText('#####'); typeText(' '); typeText('Заголовок шестого уровня'); await fin(); expect(Array.from(E.querySelectorAll('h6')).some(function (x) { return /шестого/.test(x.textContent); }), 'Markdown «##### » создаёт h6'); });
  await scenario('Заголовок 3 · по центру + жирный', async function () {
    var p = await textPara('Заголовок по центру'); await menuPick('style', /Заголовок 3/); await menuPick('align', /По центру/); var h3 = Array.from(E.querySelectorAll('h3')).pop(); caretAt(h3, true); return await press('bold');
  });

  // =============== СПИСКИ ===============
  await scenario('Список · три пункта', async function () {
    var ul = await insert('ul'); caretAt(ul.querySelector('li')); typeText('Первый'); key('Enter'); typeText('Второй'); key('Enter'); typeText('Третий'); await fin();
  });
  await scenario('Список · вложенный (Tab)', async function () {
    var ul = await insert('ul'); caretAt(ul.querySelector('li')); typeText('Верхний'); key('Enter'); typeText('Вложенный'); key('Tab'); key('Enter'); typeText('Ещё вложенный'); await fin();
  });
  await scenario('Список · курсив и ссылка в пункте', async function () {
    var ul = await insert('ul'); caretAt(ul.querySelector('li')); typeText('Пункт со словом ' + WORD); await fin(); selectWord(ul, WORD); var s = await press('italic'); return s;
  });
  await scenario('Нумерованный · три пункта', async function () {
    var ol = await insert('ol'); caretAt(ol.querySelector('li')); typeText('Раз'); key('Enter'); typeText('Два'); key('Enter'); typeText('Три'); await fin();
  });
  await scenario('Нумерованный · по центру', async function () {
    var ol = await insert('ol'); caretAt(ol.querySelector('li')); typeText('Раз'); key('Enter'); typeText('Два'); await fin(); return await menuPick('align', /По центру/);
  });
  await scenario('Список · цветной фон', async function () {
    var ul = await insert('ul'); caretAt(ul.querySelector('li')); typeText('Пункт'); await fin(); return await menuPick('color', /Акцентный/);
  });

  // =============== ЧЕК-ЛИСТ ===============
  await scenario('Чек-лист · пустой (1 пункт)', async function () { var cl = await insert('checklist'); return cl.querySelectorAll('li').length + ' пункт'; });
  await scenario('Чек-лист · три пункта, два отмечены', async function () {
    var cl = await insert('checklist'); caretAt(cl.querySelector('li')); typeText('Подготовить'); key('Enter'); typeText('Проверить'); key('Enter'); typeText('Опубликовать');
    var lis = cl.querySelectorAll('li'); caretAt(lis[0], true); key('Enter', { ctrlKey: true }); caretAt(lis[1], true); key('Enter', { ctrlKey: true }); await fin();
  });
  await scenario('Чек-лист · курсив + цветной фон недоступен', async function () {
    var cl = await insert('checklist'); caretAt(cl.querySelector('li')); typeText('Пункт ' + WORD); await fin(); selectWord(cl, WORD); var a = await press('italic'); var bgState = btnState('color'); return 'курсив: ' + a + ', кнопка фона: ' + bgState;
  });
  await scenario('Чек-лист · выравнивания нет (кнопка убрана)', async function () {
    var cl = await insert('checklist'); caretAt(cl.querySelector('li')); typeText('Пункт'); await fin();
    var st = btnState('align'); expect(st !== 'есть', 'кнопка «Выравнивание» у чек-листа убрана, а она: ' + st);
    ed.exec('align:center'); await fin(); expect(!cl.className.includes('ted-align'), 'команда выравнивания не действует');
    return 'кнопка: ' + st;
  });

  // =============== ШАГИ ===============
  await scenario('Шаги · пустой (1 шаг)', async function () { var s = await insert('steps'); return s.querySelectorAll('li').length + ' шаг'; });
  await scenario('Шаги · три шага с описаниями', async function () {
    var s = await insert('steps'); caretAt(s.querySelector('li > strong'));
    typeText('Выберите'); key('Enter'); typeText('Откройте каталог'); key('Enter'); typeText('Оплатите'); key('Enter'); typeText('Выберите способ'); key('Enter'); typeText('Получите'); key('Enter'); typeText('Заберите заказ'); await fin();
  });
  await scenario('Шаги · кнопка «Жирный» скрыта в заголовке, курсив в описании', async function () {
    var s = await insert('steps'); caretAt(s.querySelector('li > strong')); typeText('Заголовок'); ed.updateState(); var bold = btnState('bold'); key('Enter'); typeText('Описание ' + WORD); await fin(); selectWord(s, WORD); var it = await press('italic'); return 'жирный в заголовке: ' + bold + ', курсив: ' + it;
  });
  await scenario('Шаги · цветной фон и выравнивание недоступны', async function () {
    var s = await insert('steps'); caretAt(s.querySelector('li > strong')); typeText('Шаг'); ed.updateState();
    var bg = btnState('color'), al = btnState('align');
    expect(bg !== 'есть', 'кнопка фона у шагов убрана'); expect(al !== 'есть', 'кнопка выравнивания у шагов убрана');
    ed.exec('align:right'); await fin(); expect(!s.className.includes('ted-align'), 'команда выравнивания не действует');
    return 'фон: ' + bg + ', выравнивание: ' + al;
  });

  // =============== ЦИТАТА ===============
  await scenario('Цитата · набрана', async function () { var q = await insert('blockquote'); caretAt(q.querySelector('p')); typeText('Лучший способ предсказать будущее — создавать его.'); await fin(); });
  await scenario('Цитата · жирный и курсив', async function () {
    var q = await insert('blockquote'); caretAt(q.querySelector('p')); typeText('Цитата со словом ' + WORD); await fin(); selectWord(q, WORD); var a = await press('bold'); var b = await press('italic'); return a + ', ' + b;
  });
  await scenario('Цитата · с автором из списка', async function () {
    var q = await insert('blockquote'); caretAt(q.querySelector('p')); typeText('Цитата с автором'); await fin(); ed.updateState(); ed.handle.syncItem();
    var btn = ed.handle.authorBtn; if (btn.classList.contains('is-visible') === false && !btn.offsetParent) throw new Error('кнопка «Добавить автора» не показана');
    btn.click(); await sleep(60);
    var it = Array.from(document.querySelectorAll('.ted-ui-pop .ted-ui-item')).find(function (x) { return /Анна/.test(x.textContent); });
    if (!it) throw new Error('нет автора в списке'); it.click(); await sleep(40); await fin();
  });
  await scenario('Цитата · автор вручную, длинное имя', async function () {
    var q = await insert('blockquote'); caretAt(q.querySelector('p')); typeText('Цитата'); await fin(); ed.updateState(); ed.handle.syncItem();
    ed.handle.authorBtn.click(); await sleep(60);
    var it = Array.from(document.querySelectorAll('.ted-ui-pop .ted-ui-item')).find(function (x) { return /вручную/.test(x.textContent); });
    if (!it) throw new Error('нет «Ввести вручную»'); it.click(); await sleep(40); await fin();
    var a = q.querySelector('p.ted-author'); if (!a) throw new Error('автор не создан');
    caretAt(a.querySelector('strong'), true); typeText('Александра Константинопольская-Вишневецкая'); key('Enter'); typeText('Главный редактор по связям с общественностью'); await fin();
  });
  await scenario('Цитата · по центру и цветной фон', async function () {
    var q = await insert('blockquote'); caretAt(q.querySelector('p')); typeText('Цитата'); await fin(); var a = await menuPick('align', /По центру/); var b = await menuPick('color', /Стандартный/); return a + ', ' + b;
  });

  // =============== ВЫНОСКА ===============
  await scenario('Выноска · пустая (заглушки)', async function () { var c = await insert('callout'); caretAt(c.querySelector('p')); await fin(); return 'заглушек: ' + c.querySelectorAll('[data-tedui-ph]').length; });
